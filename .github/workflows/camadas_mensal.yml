# .github/workflows/camadas_mensal.yml
#
# A TAREFA MENSAL das camadas do mapa (GitHub Actions).
#
# Uma REGIÃO por dia, nos dias 1 a 5 de cada mês, às 06:17 de Brasília:
#   dia 1 Nordeste · dia 2 Norte · dia 3 Centro-Oeste · dia 4 Sudeste · dia 5 Sul
# Por que dividir: no GitHub cada consulta ao Overpass leva uns 30 a 40 s
# (o computador do GitHub divide o endereço de internet com muita gente), e
# os 27 estados de uma vez passariam do limite de tempo da tarefa.
#
# Em cada rodada, um computador do próprio GitHub (Ubuntu) baixa este
# repositório, roda os testes, gera os estados da região com o
# scripts/gerar_camadas.py, atualiza o indice.json e, se algo mudou, faz o
# commit e o push sozinho. O GitHub Pages publica em seguida.
#
# Também dá para rodar na hora, pelo botão "Run workflow" na aba Actions,
# escolhendo a região ou digitando só alguns estados (para refazer os que
# falharam, por exemplo).
#
# Se algum estado falhar, os que deram certo são publicados assim mesmo, os
# que falharam continuam com a versão anterior, e a tarefa termina marcada
# como falha: o GitHub manda um e-mail avisando.
#
# Custo: nenhum. Repositório público usa o GitHub Actions de graça.

name: Camadas mensais

on:
  schedule:
    # Os textos abaixo precisam ser IGUAIS aos do passo "Gerar as camadas"
    # (é por eles que a tarefa sabe qual região é a do dia). O minuto
    # "quebrado" foge da hora cheia, quando o GitHub atrasa mais as tarefas.
    - cron: "17 9 1 * *"   # Nordeste
    - cron: "17 9 2 * *"   # Norte
    - cron: "17 9 3 * *"   # Centro-Oeste
    - cron: "17 9 4 * *"   # Sudeste
    - cron: "17 9 5 * *"   # Sul
  workflow_dispatch:
    inputs:
      regiao:
        description: "Região"
        type: choice
        options: [nordeste, norte, centro-oeste, sudeste, sul]
        default: nordeste
      estados:
        description: "Ou só estes estados, separados por espaço (ex.: BA SP). Se preencher, a região é ignorada."
        required: false
        default: ""
      forcar:
        description: "Gravar mesmo se a trava apontar queda grande"
        type: boolean
        default: false

# O que a tarefa pode fazer no repositório: escrever (para o commit).
permissions:
  contents: write

# Nunca duas rodadas ao mesmo tempo (uma agendada e outra pelo botão, por
# exemplo): a segunda espera a primeira terminar.
concurrency:
  group: camadas
  cancel-in-progress: false

jobs:
  camadas:
    runs-on: ubuntu-latest
    # A região mais demorada (Nordeste, 9 estados) leva perto de 1h30.
    # 3 horas é a folga antes de desistir.
    timeout-minutes: 180
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      # O Python já vem no Ubuntu do GitHub, e os scripts só usam a
      # biblioteca padrão: não precisa instalar nada.
      - name: Testes dos scripts
        run: python3 -m unittest discover -s scripts -p "teste_*.py"

      # continue-on-error: mesmo que algum estado falhe (código de saída 1),
      # a tarefa segue para publicar os que deram certo. O aviso de falha
      # fica para o último passo.
      - name: Gerar as camadas
        id: gerar
        continue-on-error: true
        env:
          AGENDA: ${{ github.event.schedule }}
          REGIAO_ESCOLHIDA: ${{ inputs.regiao }}
          ESTADOS: ${{ inputs.estados }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          case "$AGENDA" in
            "17 9 1 * *") REGIAO=nordeste ;;
            "17 9 2 * *") REGIAO=norte ;;
            "17 9 3 * *") REGIAO=centro-oeste ;;
            "17 9 4 * *") REGIAO=sudeste ;;
            "17 9 5 * *") REGIAO=sul ;;
            *) REGIAO="$REGIAO_ESCOLHIDA" ;;
          esac
          if [ -n "$ESTADOS" ]; then ALVO="$ESTADOS"; else ALVO="--regiao $REGIAO"; fi
          EXTRA=""
          if [ "$FORCAR" = "true" ]; then EXTRA="--forcar"; fi
          echo "Rodando: $ALVO $EXTRA"
          python3 scripts/gerar_camadas.py $ALVO $EXTRA

      - name: Atualizar o índice
        run: python3 scripts/atualizar_indice.py

      # Só faz commit se algum arquivo mudou. O "git pull --rebase" antes do
      # push junta com algo que você tenha subido enquanto a tarefa rodava
      # (a agenda de eventos, por exemplo).
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camadas/ indice.json
          if git diff --cached --quiet; then
            echo "Nada mudou: nada para publicar."
            exit 0
          fi
          git commit -m "Camadas: atualização automática de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git pull --rebase
          git push

      - name: Avisar se algum estado falhou
        if: steps.gerar.outcome == 'failure'
        run: |
          echo "::error::Algum estado falhou (veja o passo 'Gerar as camadas'). Os outros foram publicados; os que falharam continuam com a versão anterior."
          exit 1
